<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核查卡 · 据实</title>
<style>
:root{
  --ink:#0f1216; --ink2:#5b6169; --ink3:#8f959e; --line:#e7e9eb; --line2:#f0f2f4;
  --brand:#0052d9; --brand-soft:#ecf2fe;
  --red:#d54941; --red-bg:#fdf3f2;
  --amber:#e37318; --amber-bg:#fef7ee;
  --green:#2ba471; --green-bg:#f1faf5;
  --gray:#5b6169; --gray-bg:#f3f5f8;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:#f3f5f8;color:var(--ink);line-height:1.7;font-size:14px;padding:20px 12px 36px;-webkit-font-smoothing:antialiased}
.sheet{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}

/* 头部 */
.hd{padding:18px 20px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hd .t{font-size:11.5px;color:var(--ink3);letter-spacing:.08em}
.hd .n{font-size:17px;font-weight:600;margin-top:5px;letter-spacing:.02em}
.hd .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--ink3);text-align:right;white-space:nowrap}
.body{padding:18px 20px}

/* 结论块 */
.verdict{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:2px;margin-bottom:16px;border-left:2px solid transparent}
.verdict.high,.verdict.false{background:var(--red-bg);border-left-color:var(--red)}
.verdict.mid,.verdict.unclear,.verdict.misleading{background:var(--amber-bg);border-left-color:var(--amber)}
.verdict.low,.verdict.true{background:var(--green-bg);border-left-color:var(--green)}
.verdict.pending,.verdict.no_source{background:var(--gray-bg);border-left-color:#b9bfc7}
.vlabel{font-size:19px;font-weight:600;line-height:1.3;white-space:nowrap;letter-spacing:.04em}
.high .vlabel,.false .vlabel{color:var(--red)}
.mid .vlabel,.unclear .vlabel{color:var(--amber)}
.low .vlabel,.true .vlabel{color:var(--green)}
.pending .vlabel,.no_source .vlabel{color:var(--gray)}
.vreason{font-size:13px;color:var(--ink2);line-height:1.7}

/* 原句 */
.q{font-size:13.5px;font-weight:500;background:#fafbfc;border-left:2px solid var(--line);padding:10px 13px;border-radius:0 2px 2px 0;margin-bottom:16px;color:var(--ink2);line-height:1.75}

/* 风险清单 */
.list{list-style:none}
.list li{padding:11px 0;border-bottom:1px solid var(--line2);display:flex;gap:9px}
.list li:last-child{border:0}
.pill{font-size:11px;font-weight:500;padding:2px 7px;border-radius:2px;height:fit-content;white-space:nowrap;margin-top:2px;flex:none}
.pill.high{background:var(--red-bg);color:var(--red)}
.pill.mid{background:var(--amber-bg);color:var(--amber)}
.pill.low{background:var(--green-bg);color:var(--green)}
.pill.pending{background:var(--gray-bg);color:var(--gray)}
.li-s{font-size:13.5px;font-weight:500;line-height:1.65;color:var(--ink)}
.li-f{font-size:12.5px;color:#1d6a4c;margin-top:3px;line-height:1.7}

/* 证据 */
.ev{padding:10px 0;border-top:1px solid var(--line2);font-size:12.5px}
.ev:first-of-type{border-top:0;padding-top:6px}
.ev a{color:var(--brand);text-decoration:none;font-weight:500}
.ev a:hover{text-decoration:underline}
.ev .m{color:var(--ink3);font-size:11.5px;margin-top:2px}

/* 页脚 */
.ft{border-top:1px solid var(--line);padding:15px 20px;display:flex;gap:14px;align-items:center}
.ft img{width:72px;height:72px;border-radius:2px;border:1px solid var(--line)}
.ft .nm{font-weight:600;font-size:14px}
.ft .tg{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.7}
.disc{font-size:11px;color:var(--ink3);padding:0 20px 18px;line-height:1.75;border-top:1px solid var(--line2);padding-top:12px;margin-top:0}

/* 操作 */
.act{max-width:560px;margin:12px auto 0;display:flex;gap:10px}
.act a,.act button{flex:1;text-align:center;padding:10px;border-radius:2px;font-size:13.5px;font-weight:500;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-family:var(--font);transition:.15s}
.act a:hover,.act button:hover{border-color:var(--brand);color:var(--brand)}
.act a.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.act a.primary:hover{background:#266fe8;color:#fff}
.foot-note{
  font-size:11.5px;
  color:var(--ink3);
  line-height:1.75;
  background:#fafbfc;
  border-radius:2px;
  padding:9px 11px;
  margin-top:14px;
}
.loading{max-width:560px;margin:40px auto;text-align:center;color:var(--ink3);font-size:13.5px}
@media(max-width:560px){
  body{padding:14px 10px 28px}
  .hd,.body,.ft{padding-left:16px;padding-right:16px}
  .disc{padding-left:16px;padding-right:16px}
  .vlabel{font-size:17px}
  .act{margin-top:10px}
}
</style>

</head>
<body class="card-page">
<div id="root"><div class="loading">正在加载核查卡…</div></div>
<div class="act" id="act" style="display:none">
  <a class="primary" href="/">我也要核验</a>
  <a href="#" id="reportLink" style="display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border:1px solid #cfd6e0;border-radius:6px;color:#333;text-decoration:none;font-size:13px">导出报告 →</a>
  <button onclick="window.print()">保存为图片</button>
</div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TONE = {"true":"true","false":"false",unclear:"unclear",no_source:"no_source"};
const LBL = {"true":"真","false":"假",misleading:"误导",unclear:"说不准",no_source:"没查到可靠来源"};

function evHTML(e){
  return `<div class="ev"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title).slice(0,70)}</a>
    <div class="m">${esc(e.site||"未知站点")} · ${esc(e.date||"无日期")} · 权威度 ${e.authority}/5</div></div>`;
}

function verifyCard(d){
  const v = d.verdict, tone = TONE[v.verdict] || "pending";
  const ev = (d.top_evidence && d.top_evidence.length ? d.top_evidence : d.evidence) || [];
  return `<div class="sheet">
    <div class="hd">
      <div><div class="t">发布前事实核查</div><div class="n">据实</div></div>
      <div class="code">#${esc(d.code||"")}<br>${(d.created_at||"").slice(0,16).replace("T"," ")}</div>
    </div>
    <div class="body">
      <div class="verdict ${tone}">
        <div class="vlabel">${esc(v.label)}</div>
        <div class="vreason">${esc(v.reason)}</div>
      </div>
      <div class="q">${esc(d.claim.raw).slice(0,120)}</div>
      <div style="font-size:12px;color:var(--ink3);margin-bottom:4px;letter-spacing:.06em">关键依据 · 点击可核验</div>
      ${ev.map(evHTML).join("") || '<div class="ev">没拿到可点开的来源。</div>'}
      ${(d.missing&&d.missing.length)?`<div style="font-size:12.5px;color:var(--amber);margin-top:12px">
        <b>还差什么证据：</b>${esc(d.missing.join("；"))}</div>`:""}
      <div class="foot-note">
        本次检索 ${d.searches} 次 · 来源 ${d.evidence.length} 条 · ${(d.conflict && d.conflict.length) ? "来源存在分歧，已按四维判决" : "来源一致"}
        ${d.queried_at ? ' · 实时检索于 ' + esc(d.queried_at).slice(0,16) : ''}
        ${d.demo ? ' · <b style="color:var(--amber)">演示数据，非真实查询</b>' : ''}
      </div>
    </div>
    <div class="ft" style="justify-content:flex-start;padding-left:22px">
      <div><div class="nm" id="onm">zengyan</div>
        <div class="tg">据实 · 发布前事实核查<br>免费使用 · 免注册 · 查完可再查验<br><span style="color:#a5adb6">1024超能Coding周末 · 侦探赛道参赛作品 · 检索能力：腾讯元宝搜索</span></div></div>
    </div>
    <div class="disc">${esc(d.disclaimer||"")}</div>
  </div>`;
}

function checkupCard(d){
  const items = d.items || [];
  const highN = (d.counts&&d.counts.high)||0;
  const tone = highN ? "high" : (d.counts&&d.counts.mid) ? "mid" : "low";
  const label = highN ? "有风险" : (d.counts&&d.counts.mid) ? "需修改" : "可发布";
  const evs = items.flatMap(i => (i.evidence||[]).slice(0,1));
  return `<div class="sheet">
    <div class="hd">
      <div><div class="t">文案体检结果</div><div class="n">据实</div></div>
      <div class="code">#${esc(d.code||"")}<br>${(d.created_at||"").slice(0,16).replace("T"," ")}</div>
    </div>
    <div class="body">
      <div class="verdict ${tone}">
        <div class="vlabel">${label}</div>
        <div class="vreason">${esc(d.headline||"")}</div>
      </div>
      <ul class="list">
        ${items.map(i=>`<li>
          <span class="pill ${i.risk_level}">${i.risk_level==="high"?"高风险":i.risk_level==="mid"?"需存疑":"有依据"}</span>
          <div><div class="li-s">${esc(i.sentence).slice(0,60)}</div>
          ${(i.fix||"").trim()?`<div class="li-f">建议：${esc(i.fix)}</div>`:""}</div>
        </li>`).join("")}
      </ul>
      ${(d.lex && d.lex.length) ? `<div style="font-size:12px;color:var(--ink3);margin:12px 0 6px">违禁词 ${d.lex.length} 处</div>
      <div style="font-size:12.5px;line-height:1.9">${d.lex.slice(0,6).map(h=>`<div>· <b style="color:${h.level==='high'?'#c62828':'var(--amber)'}">${esc(h.word)}</b> <span style="color:var(--ink3)">${esc(h.category)}</span></div>`).join("")}</div>` : ""}
      <div style="font-size:12px;color:var(--ink3);margin:12px 0 4px;letter-spacing:.06em">依据 · 点击可核验</div>
      ${evs.map(evHTML).join("") || ""}
      <div style="font-size:11.5px;color:var(--ink3);margin-top:12px">
        共 ${d.counts?d.counts.sentences:0} 句 · 深查 ${d.counts?d.counts.checked:0} 句 · 检索 ${d.searches} 次 · 来源 ${d.sources} 条
        ${d.queried_at ? ' · 实时检索于 ' + esc(d.queried_at).slice(0,16) : ''}
        ${d.demo ? ' · <b style="color:var(--amber)">演示数据，非真实查询</b>' : ''}
      </div>
    </div>
    <div class="ft" style="justify-content:flex-start;padding-left:22px">
      <div><div class="nm" id="onm">zengyan</div>
        <div class="tg">据实 · 发布前事实核查<br>免费使用 · 免注册 · 查完可再查验<br><span style="color:#a5adb6">1024超能Coding周末 · 侦探赛道参赛作品 · 检索能力：腾讯元宝搜索</span></div></div>
    </div>
    <div class="disc">${esc(d.disclaimer||"")}</div>
  </div>`;
}

(async () => {
  const code = location.pathname.split("/").filter(Boolean).pop();
  fetch("/api/health").then(r => r.json()).then(h => {
    if (!h || !h.owner) return;
    document.querySelectorAll(".ft .nm").forEach(el => { if (h.owner.name) el.textContent = h.owner.name; });
    document.querySelectorAll(".ft .tg").forEach(el => {
      const line = h.owner.tagline || "";
      el.innerHTML = h.owner.show_qr === false
        ? `${line}`
        : `${line}<br>免费使用 · 免注册 · 改完可以再查验`;
    });
    if (h.owner.show_qr === false) {
      document.querySelectorAll(".ft img").forEach(el => { el.style.display = "none"; });
    }
  }).catch(() => {});
  try{
    const r = await fetch("/api/q/" + encodeURIComponent(code));
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "没有找到这条记录");
    document.title = "核查卡 #" + code + " · 据实";
    document.getElementById("root").innerHTML = (d.verdict ? verifyCard(d) : checkupCard(d));
    document.getElementById("act").style.display = "flex";
    const rl = document.getElementById("reportLink"); if (rl) rl.href = "/r/" + encodeURIComponent(code);
  }catch(e){
    document.getElementById("root").innerHTML = `<div class="loading">${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
