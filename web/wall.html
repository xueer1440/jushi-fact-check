<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查证墙 · 据实</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230052d9'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='600' text-anchor='middle' fill='%23fff' font-family='PingFang SC,sans-serif'%3E据%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#0f1216;--ink2:#5b6169;--ink3:#8f959e;--line:#e7e9eb;--brand:#0052d9;
--red:#d54941;--red-bg:#fdf3f2;--amber:#e37318;--amber-bg:#fef7ee;--green:#2ba471;--green-bg:#f1faf5;--gray:#596069;--gray-bg:#eff1f4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
.top{position:relative;overflow:hidden;background:linear-gradient(105deg,#f4f8ff 0%,#e9f1fe 45%,#dcebfe 100%);border-bottom:1px solid #e3edfc;padding:24px 0 20px;margin-bottom:18px}
.top::before{content:"";position:absolute;right:-90px;top:-70px;width:420px;height:280px;background:radial-gradient(closest-side,rgba(0,82,217,.14),rgba(77,141,255,.07) 55%,transparent 78%);filter:blur(6px);animation:wallGlow 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes wallGlow{from{transform:translate(0,0)}to{transform:translate(-50px,24px)}}
.top::after{content:"";position:absolute;right:26px;top:20px;width:130px;height:60px;background-image:radial-gradient(rgba(0,82,217,.16) 1px,transparent 1.4px);background-size:13px 13px;opacity:.6;pointer-events:none}
.top .wrap{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.top::before{animation:none}}
@media print{.top{background:#fff}.top::before,.top::after{display:none}}
.t{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:21px;font-weight:700}
h1 span{color:var(--brand)}
.sub{font-size:13px;color:var(--ink3);margin-top:4px}
.stat{display:flex;gap:18px;margin-top:14px}
.stat div{font-size:12.5px;color:var(--ink3)}
.stat b{display:block;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid #f0f2f4;align-items:flex-start;text-decoration:none;color:inherit;transition:.15s}
.row:last-child{border:0}
.row:hover{background:#fafcff}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.dot.false,.dot.risk,.dot.high{background:var(--red)}
.dot.unclear,.dot.mid{background:#e0a318}
.dot.true,.dot.ok,.dot.low{background:#2a9d58}
.dot.no_source,.dot.pending{background:#aab1ba}
.txt{flex:1;min-width:0}
.s{font-size:14px;line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--gray-bg);color:var(--gray)}
.tag.false,.tag.risk{background:var(--red-bg);color:var(--red)}
.tag.unclear{background:var(--amber-bg);color:var(--amber)}
.tag.true,.tag.ok{background:var(--green-bg);color:var(--green)}
.cta{margin-top:18px;text-align:center}
.cta a{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;padding:12px 26px;border-radius:11px;font-weight:600}
.note{font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.7;text-align:center}
.empty{padding:36px 16px;text-align:center;color:var(--ink3);font-size:13.5px}
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="t">
      <a href="/" style="display:inline-flex;align-items:center;gap:7px;text-decoration:none;margin-bottom:12px">
        <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#0052d9"/><text x="16" y="22" font-size="16" font-weight="600" text-anchor="middle" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif">据</text></svg>
        <span style="font-size:13px;color:#5b6169">据实 · 发布前事实核查</span>
      </a>
      <div>
        <h1>最近大家在<span>查什么</span></h1>
        <div class="sub">每条均附结论与可核验来源，点开可查看完整取证过程</div>
      </div>
    </div>
    <div class="stat">
      <div><b id="sTotal">0</b>累计查证</div>
      <div><b id="sVisitors">0</b>独立访客</div>
      <div><b id="sStamp" style="font-size:13px;line-height:1.9">—</b>更新时间</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="list" id="list"><div class="empty">加载中…</div></div>
  <div class="cta"><a href="/">我也要核验 →</a></div>
  <div class="note">内容已脱敏：只显示前 40 字，不显示提问者身份。<br>本结果为公开信息核查与风险提示，不构成法律意见。</div>
</div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL = {true:"真","false":"假",misleading:"误导",unclear:"说不准",no_source:"没查到",risk:"有风险",ok:"无硬伤"};
const $ = s => document.querySelector(s);

async function tick(){
  try{
    const r = await fetch("/api/wall");
    const d = await r.json();
    $("#sTotal").textContent = d.total;
    $("#sVisitors").textContent = d.visitors;
    $("#sStamp").textContent = (d.generated_at||"").slice(11,16);
    const items = (d.items||[]).map(it => {
      const tone = it.verdict || "no_source";
      const kind = it.kind === "checkup" ? "文案体检" : "查传言";
      return `<a class="row" href="/q/${esc(it.code)}" target="_blank" rel="noopener">
        <span class="dot ${esc(tone)}"></span>
        <div class="txt">
          <div class="s">${esc(it.text)}</div>
          <div class="m"><span class="tag ${esc(tone)}">${esc(LBL[tone]||tone)}</span>
            <span>${kind}</span><span>#${esc(it.code)}</span><span>${esc(it.time)}</span></div>
        </div>
      </a>`;
    }).join("");
    $("#list").innerHTML = items || '<div class="empty">还没有人查过，来做第一个</div>';
  }catch(e){
    $("#list").innerHTML = '<div class="empty">连接失败，稍后刷新</div>';
  }
}
tick(); setInterval(tick, 8000);
</script>
</body>
</html>
