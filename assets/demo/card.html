<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#08251c;position:relative;overflow:hidden;
     font-family:"Microsoft YaHei","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(62,224,160,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(62,224,160,.06) 1px,transparent 1px);background-size:60px 60px}
.wrap{position:relative;padding:0 96px;text-align:center}
.kicker{font-size:30px;color:#3ee0a0;letter-spacing:.24em;margin-bottom:52px}
.t1{font-size:88px;line-height:1.34;color:#eafff5;font-weight:900}
.t1 em{font-style:normal;color:#3ee0a0}
.t2{font-size:92px;line-height:1.3;color:#fff;font-weight:900}
.t2 em{font-style:normal;color:#ffd166}
.sub{margin-top:56px;font-size:42px;line-height:1.7;color:#a9c9bd;font-weight:500}
.url{margin-top:70px;font-size:38px;color:#3ee0a0;line-height:1.7;word-break:break-all;font-weight:700}
.tip{margin-top:26px;font-size:28px;color:#8fb3a5;line-height:1.7}
</style></head><body><div class="grid"></div>
<div class="wrap" id="w"></div>
<script>
const C = new URLSearchParams(location.search).get('c');
const M = {
 c1: `<div class="kicker">据 实 · 发 布 前 事 实 核 查</div>
      <div class="t1">AI 编瞎话的时候<br>最气人的不是它错</div>
      <div class="t1" style="margin-top:26px"><em>是它特别自信</em></div>`,
 c2: `<div class="kicker">真 实 罚 单</div>
      <div class="t2">海报上写了四个字<br><em>日本引进</em></div>
      <div class="t2" style="margin-top:34px">罚了二十万</div>
      <div class="sub">这四个字，不在任何违禁词库里</div>`,
 c3: `<div class="kicker">据 实</div>
      <div class="t1">查得到，亮出处<br><em>查不到，不硬编</em></div>
      <div class="url">jushi-fact-check.app.workbuddy.host</div>
      <div class="tip">浏览器打开即用，免注册<br>微信里打开会提示「在浏览器中打开」</div>`
};
document.getElementById('w').innerHTML = M[C] || M.c1;
</script></body></html>
