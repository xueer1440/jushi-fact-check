<!doctype html><html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1440px;background:#08251c;font-family:"Microsoft YaHei","PingFang SC",sans-serif;position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(62,224,160,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(62,224,160,.07) 1px,transparent 1px);background-size:48px 48px}
  .frame{position:absolute;inset:36px;border:6px solid #3ee0a0;box-shadow:12px 12px 0 rgba(62,224,160,.18)}
  .corner{position:absolute;width:26px;height:26px;background:#3ee0a0}
  .c1{top:24px;left:24px}.c2{top:24px;right:24px}.c3{bottom:24px;left:24px}.c4{bottom:24px;right:24px}
  .inner{position:absolute;inset:80px 84px;display:flex;flex-direction:column}
  .tag{display:inline-flex;align-items:center;gap:14px;font-size:26px;color:#3ee0a0;letter-spacing:.18em;border:3px solid #3ee0a0;padding:12px 22px;align-self:flex-start}
  .tag b{width:16px;height:16px;background:#3ee0a0;display:block}
  h1{margin-top:86px;font-size:118px;line-height:1.18;color:#eafff5;font-weight:900;letter-spacing:.01em}
  h1 .hl{color:#3ee0a0}
  .sub{margin-top:30px;font-size:40px;line-height:1.55;color:#a9c9bd;font-weight:500}
  .quote{margin-top:auto;border-left:8px solid #3ee0a0;padding:10px 0 10px 26px;font-size:34px;color:#dff5ea;line-height:1.6}
  .quote span{color:#3ee0a0;font-weight:700}
  .foot{margin-top:44px;display:flex;align-items:flex-end;justify-content:space-between;border-top:3px solid rgba(62,224,160,.35);padding-top:26px}
  .brand{font-size:52px;color:#eafff5;font-weight:900;letter-spacing:.04em}
  .brand i{font-style:normal;color:#3ee0a0}
  .desc{font-size:26px;color:#8fb3a5;margin-top:8px;letter-spacing:.06em}
  .badge{text-align:right;font-size:24px;color:#8fb3a5;line-height:1.7}
  .badge b{display:block;color:#3ee0a0;font-size:30px}

  .steps{display:flex;gap:16px;margin-top:64px}
  .step{flex:1;border:3px solid rgba(62,224,160,.45);padding:22px 20px;background:rgba(62,224,160,.05)}
  .step b{display:block;font-size:22px;color:#3ee0a0;letter-spacing:.12em}
  .step span{display:block;font-size:34px;color:#eafff5;font-weight:800;margin-top:8px;line-height:1.3}
  .step small{display:block;font-size:21px;color:#8fb3a5;margin-top:10px;line-height:1.55}
</style></head><body>
<div class="grid"></div><div class="frame"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
<div class="inner">
  <div class="tag"><b></b>侦探 · 查得到，信得过</div>
  <h1>AI 编瞎话时<br><span class="hl">特别自信</span></h1>
  <div class="sub">我用一个周末，做了个专治这个的工具<br>它的规矩只有一条：查不到，就说查不到</div>
  <div class="steps">
    <div class="step"><b>01</b><span>查三轮</span><small>广搜 · 找反方 · 溯源</small></div>
    <div class="step"><b>02</b><span>过十道闸</span><small>转载合并 · 否定式守卫</small></div>
    <div class="step"><b>03</b><span>带来源回来</span><small>每条都能点开原文</small></div>
  </div>
  <div class="quote">「发出去之前，先查一遍——<br><span>每条结论都能点开来源</span>。」</div>
  <div class="foot">
    <div>
      <div class="brand">据<i>实</i></div>
      <div class="desc">发布前事实核查 · 元宝搜索驱动</div>
    </div>
    <div class="badge"><b>免注册</b>浏览器打开即用</div>
  </div>
</div>
</body></html>
