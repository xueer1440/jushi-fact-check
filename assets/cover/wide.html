<!doctype html><html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1600px;height:1200px;background:#08251c;font-family:"Microsoft YaHei","PingFang SC",sans-serif;position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(62,224,160,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(62,224,160,.07) 1px,transparent 1px);background-size:48px 48px}
  .frame{position:absolute;inset:34px;border:6px solid #3ee0a0;box-shadow:12px 12px 0 rgba(62,224,160,.18)}
  .corner{position:absolute;width:26px;height:26px;background:#3ee0a0}
  .c1{top:22px;left:22px}.c2{top:22px;right:22px}.c3{bottom:22px;left:22px}.c4{bottom:22px;right:22px}
  .wrap{position:absolute;inset:74px 80px;display:flex;flex-direction:column}
  .tag{display:inline-flex;align-items:center;gap:14px;font-size:26px;color:#3ee0a0;letter-spacing:.18em;border:3px solid #3ee0a0;padding:10px 22px;align-self:flex-start}
  .tag b{width:16px;height:16px;background:#3ee0a0;display:block}
  .cols{display:flex;gap:70px;margin-top:56px;flex:1}
  .left{flex:1.15;display:flex;flex-direction:column}
  h1{font-size:128px;line-height:1.16;color:#eafff5;font-weight:900;letter-spacing:.01em}
  h1 .hl{color:#3ee0a0}
  .sub{margin-top:34px;font-size:38px;line-height:1.6;color:#a9c9bd;font-weight:500}
  .quote{margin-top:auto;border-left:8px solid #3ee0a0;padding:8px 0 8px 26px;font-size:33px;color:#dff5ea;line-height:1.6}
  .quote span{color:#3ee0a0;font-weight:700}
  .right{flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center}
  .step{border:3px solid rgba(62,224,160,.45);padding:26px 28px;background:rgba(62,224,160,.05)}
  .step b{display:block;font-size:22px;color:#3ee0a0;letter-spacing:.12em}
  .step span{display:block;font-size:40px;color:#eafff5;font-weight:800;margin-top:8px;line-height:1.3}
  .step small{display:block;font-size:23px;color:#8fb3a5;margin-top:8px;line-height:1.55}
  .foot{margin-top:40px;display:flex;align-items:flex-end;justify-content:space-between;border-top:3px solid rgba(62,224,160,.35);padding-top:24px}
  .brand{font-size:56px;color:#eafff5;font-weight:900;letter-spacing:.04em}
  .brand i{font-style:normal;color:#3ee0a0}
  .desc{font-size:26px;color:#8fb3a5;margin-top:8px;letter-spacing:.06em}
  .badge{text-align:right;font-size:24px;color:#8fb3a5;line-height:1.7}
  .badge b{display:block;color:#3ee0a0;font-size:30px}
</style></head><body>
<div class="grid"></div><div class="frame"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
<div class="wrap">
  <div class="tag"><b></b>侦探 · 查得到，信得过</div>
  <div class="cols">
    <div class="left">
      <h1>AI 编瞎话时<br><span class="hl">特别自信</span></h1>
      <div class="sub">我用一个周末，做了个专治这个的工具<br>它的规矩只有一条：查不到，就说查不到</div>
      <div class="quote">「发出去之前，先查一遍——<br><span>每条结论都能点开来源</span>。」</div>
    </div>
    <div class="right">
      <div class="step"><b>01</b><span>查三轮</span><small>广搜 · 找反方 · 溯源</small></div>
      <div class="step"><b>02</b><span>过十道闸</span><small>转载合并 · 否定式守卫 · 数字门</small></div>
      <div class="step"><b>03</b><span>带来源回来</span><small>每条都能点开原文，绝不硬编</small></div>
    </div>
  </div>
  <div class="foot">
    <div>
      <div class="brand">据<i>实</i> · 发布前事实核查</div>
      <div class="desc">元宝搜索驱动 · 免注册 · 浏览器打开即用</div>
    </div>
    <div class="badge"><b>两个入口</b>事实核查 · 文案体检</div>
  </div>
</div>
</body></html>
